<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Diwali Meri Laxmi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.7)),
                  url('background.jpg') center center/cover no-repeat;
    }

    #fireworksCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .diya-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .floating-diya {
      position: absolute;
      bottom: -40px;
      font-size: 24px;
      animation: floatUp 8s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
    }

    .header-box {
      margin-top: 10vh;
      padding: 15px 20px;
      width: 90%;
      max-width: 360px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      z-index: 3;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffd700;
      line-height: 1.3;
      text-shadow: 0 0 12px #ff9900, 0 0 25px #ff3b00;
      margin-bottom: 8px;
      transition: all 0.3s ease;
    }

    .sub-msg {
      font-size: 1.05rem;
      color: #fff8dc;
      line-height: 1.4;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .button-container {
      margin-bottom: 5vh;
      width: 88%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 3;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-song {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-firework {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #2b1700;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* Naya Preeti Button */
    .btn-preeti {
      background: linear-gradient(135deg, #8a2387, #e94057, #f27121);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="diya-container" id="diyaContainer"></div>
  <canvas id="fireworksCanvas"></canvas>

  <div class="header-box">
    <h1 id="mainTitle">🪔 Happy Diwali<br>Meri Laxmi 🪔</h1>
    <div class="sub-msg" id="msgText">Har din aapki muskurahat se roshan rahe ✨</div>
  </div>

  <div class="button-container">
    <button class="btn btn-song" id="songBtn" onclick="handleSongToggle()">
      <span>🎵</span> Play Song
    </button>
    <button class="btn btn-firework" id="fireworkBtn" onclick="triggerMobileCrackers()">
      <span>💥</span> Press Me
    </button>
    <!-- Naya Button -->
    <button class="btn btn-preeti" id="preetiBtn" onclick="showPreetiWish()">
      <span>🌸</span> For Preeti
    </button>
  </div>

  <audio id="diwaliSong" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <script>
    // 1. Mobile Floating Diyas
    const diyaContainer = document.getElementById('diyaContainer');
    const diyaIcons = ['🪔', '✨', '💛', '🌸'];
    for(let i = 0; i < 12; i++) {
      let span = document.createElement('span');
      span.className = 'floating-diya';
      span.innerText = diyaIcons[Math.floor(Math.random() * diyaIcons.length)];
      span.style.left = Math.random() * 95 + '%';
      span.style.animationDelay = (Math.random() * 6) + 's';
      span.style.animationDuration = (6 + Math.random() * 5) + 's';
      diyaContainer.appendChild(span);
    }

    // 2. Song Button Action
    const audio = document.getElementById('diwaliSong');
    const songBtn = document.getElementById('songBtn');
    const msgText = document.getElementById('msgText');
    const mainTitle = document.getElementById('mainTitle');

    function handleSongToggle() {
      if (audio.paused) {
        audio.play().then(() => {
          songBtn.innerHTML = '<span>⏸️</span> Pause Song';
          msgText.innerHTML = '✨ "Ram aayenge toh deep jalawenge..." 🪔';
        }).catch(() => {
          msgText.innerHTML = '✨ "Ram aayenge toh deep jalawenge..." 🪔';
          alert("Gaana bajane ke liye folder me 'song.mp3' file rakhein!");
        });
      } else {
        audio.pause();
        songBtn.innerHTML = '<span>🎵</span> Play Song';
        msgText.innerHTML = 'Happy Diwali Meri Laxmi ❤️';
      }
    }

    // 3. Preeti Button Action
    function showPreetiWish() {
      mainTitle.innerHTML = '💖 Happy Diwali<br>Preeti 💖';
      msgText.innerHTML = 'Aap hamesha aise hi khush rahein aur muskurati rahein! ✨🪔';
      triggerMobileCrackers();
    }

    // 4. Patake (Fireworks) Setup
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');

    function setCanvasSize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', setCanvasSize);
    setCanvasSize();

    let particles = [];

    class Spark {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 2.5 + 1.5;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.06;
        this.alpha -= this.decay;
      }
    }

    function createExplosion(x, y) {
      const colors = ['#ff2a2a', '#ff69b4', '#ffd700', '#ffffff', '#00f5d4', '#ff007f'];
      for (let i = 0; i < 40; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Spark(x, y, color));
      }
    }

    function playPop() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctxAudio = new AudioContext();
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, ctxAudio.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, ctxAudio.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, ctxAudio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        osc.start();
        osc.stop(ctxAudio.currentTime + 0.12);
      } catch (e) {}
    }

    function triggerMobileCrackers() {
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          const posX = Math.random() * (canvas.width * 0.7) + (canvas.width * 0.15);
          const posY = Math.random() * (canvas.height * 0.45) + (canvas.height * 0.1);
          createExplosion(posX, posY);
          playPop();
        }, i * 220);
      }
    }

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(renderLoop);
    }
    renderLoop();
  </script>
</body>
</html>
